[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immuno-cell-analysis"
version = "0.1.0"
description = "Immuno cell analysis pipeline for FLIM phasor analysis, segmentation, correction, and cell-level quantification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "numpy",
  "pandas",
  "tifffile",
  "matplotlib",
  "scikit-image",
  "scikit-learn",
  "pillow",
  "phasorpy",
]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"